[package]
name = "dn42-autopeer"
version = "1.0.0-patch"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
axum-macros = "0.5.1"
base64 = "0.23.1"
dashmap = "6.2.1"
futures = "0.3.34"
hex = "0.4.3"
netlink-packet-route = "0.33.0"
pgp = "0.20.0"
reqwest = { version = "0.13.5", features = ["json"] }
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "crypto"] }
tokio = { version = "1.53.1", features = ["full", "io-util", "net"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
wireguard-control = "2.0.0"
