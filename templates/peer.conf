# Dynamically generated by DN42 Autopeer for AS{{ asn }}
# Interface: {{ iface }}

protocol bgp dn42_{{ asn }} {
  local {{ local_ll_ip }} as {{ local_asn }};
  neighbor {{ remote_ll_ip }} % '{{ iface }}' as {{ asn }};
  
  ipv6 {
    table dn42_v6;
    import filter dn42_import;
    export filter dn42_export;
    extended next hop on;
  };
}
