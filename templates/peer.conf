# Dynamically generated by DN42 Autopeer for AS{{ asn }}
# Peer name: {{ peer_name }} (ID {{ peer_id }})
# Interface: {{ iface }}

protocol bgp dn42_{{ asn }}_{{ peer_id }} {
  local {{ local_ll_ip }} as {{ local_asn }};
  neighbor {{ remote_ll_ip }} % '{{ iface }}' as {{ asn }};
  
  ipv6 {
    table dn42_v6;
    import where dn42_import_from_peer({{ asn }}, {{ peer_id }});
    export where dn42_export_to_peer({{ asn }}, {{ peer_id }});
  };
  ipv4 {
    table dn42_v4;
    import where dn42_import_from_peer_v4({{ asn }}, {{ peer_id }});
    export where dn42_export_to_peer_v4({{ asn }}, {{ peer_id }});
    extended next hop on;
  };
}
