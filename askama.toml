[general]
# Directories to search for templates, relative to the crate root.
dirs = ["templates"]
# Unless you add a `-` in a block, whitespace characters won't be trimmed.
whitespace = "preserve"

[[escaper]]
# 指向你的 Rust 代码中 Escaper 结构体的完整路径
path = "crate::template::Escaper"
# 绑定 BIRD 配置文件的常用后缀名
extensions = ["conf"]

